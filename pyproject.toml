[project]
name = "time-to-go-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "email-validator>=2.3.0",
    "passlib>=1.7.4",
    "pydantic>=2.13.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "greenlet>=3.4.0",
    "httpx>=0.28.0",
    "bcrypt==4.0.1",
    "firebase-admin>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# FastAPI declaratively defines dependencies and request parameters in defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Historical migrations are immutable; retain their original import order.
"alembic/versions/000*.py" = ["I001"]
