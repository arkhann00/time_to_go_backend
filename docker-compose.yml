services:
  api:
    build: .
    container_name: time_to_go_backend
    environment:
      SECRET_KEY: change-me-in-production
      ADMIN_SECRET_KEY: change-me-admin-key
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      IPAPI_API_KEY: ${IPAPI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    command: >
      sh -c "mkdir -p /app/data &&
             export DATABASE_URL=sqlite+aiosqlite:///./data/app.db &&
             uv run alembic upgrade head &&
             uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "127.0.0.1:2015:2015"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
